<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#1db954" />
    <title>Monirul Hasan Talha - Portfolio</title>
    <meta name="description" content="Web Developer &amp; Tech Enthusiast specializing in HTML, CSS, JavaScript, and React. Explore my projects and journey.">
    <meta name="author" content="Monirul Hasan Talha" />
    <meta name="google-site-verification" content="3B_xv5r-SCXNUqwysDxckRmy4adnJPooCHrlDnxxqiw" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512.png">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/pwa-512.png">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-startup-image" href="/splash-screen.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <meta property="og:title" content="Monirul Hasan Talha - Portfolio">
    <meta name="twitter:title" content="Monirul Hasan Talha - Portfolio">
    <meta property="og:description" content="Web Developer &amp; Tech Enthusiast specializing in HTML, CSS, JavaScript, and React. Explore my projects and journey.">
    <meta name="twitter:description" content="Web Developer &amp; Tech Enthusiast specializing in HTML, CSS, JavaScript, and React. Explore my projects and journey.">
  </head>

  <body>
    <div id="root">
      <!-- Modern Loading Screen -->
      <div id="app-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #08131a 0%, #0d1f29 50%, #08131a 100%);
        z-index: 9999;
      ">
        <!-- Logo Image -->
        <div style="
          width: 120px;
          height: 120px;
          margin-bottom: 32px;
          border-radius: 24px;
          overflow: hidden;
          box-shadow: 0 0 40px rgba(29, 185, 84, 0.4);
          animation: pulse 1.5s ease-in-out infinite;
        ">
          <img src="/pwa-192.png" alt="MHT Logo" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
        
        <!-- Loading text with shimmer -->
        <div style="
          font-family: 'Inter', sans-serif;
          font-size: 18px;
          font-weight: 600;
          color: #ffffff;
          margin-bottom: 8px;
          letter-spacing: 0.5px;
        ">Monirul Hasan Talha</div>
        
        <!-- Subtitle -->
        <div style="
          font-family: 'Inter', sans-serif;
          font-size: 13px;
          color: rgba(255, 255, 255, 0.6);
          margin-bottom: 24px;
        ">Loading Portfolio...</div>
        
        <!-- Modern progress bar -->
        <div style="
          width: 200px;
          height: 4px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 4px;
          overflow: hidden;
        ">
          <div style="
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #1db954, transparent);
            animation: shimmer 1.5s ease-in-out infinite;
          "></div>
        </div>
        
        <style>
          @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.95); opacity: 0.9; }
          }
          @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide loader when app is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.style.transition = 'opacity 0.5s ease';
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }
        }, 300);
      });
    </script>
  </body>
</html>
