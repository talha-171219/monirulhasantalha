    <meta name="twitter:title" content="Monirul Hasan Talha - Portfolio">
    <meta property="og:description" content="Web Developer &amp; Tech Enthusiast specializing in HTML, CSS, JavaScript, and React. Explore my projects and journey.">
    <meta name="twitter:description" content="Web Developer &amp; Tech Enthusiast specializing in HTML, CSS, JavaScript, and React. Explore my projects and journey.">
  </head>

  <body>
    <div id="root">
      <!-- Futuristic Loading Screen -->
      <div id="app-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #0d1f29 0%, #08131a 50%, #030a0e 100%);
        z-index: 9999;
        overflow: hidden;
      ">
        <!-- Animated Background Grid -->
        <div class="cyber-grid"></div>
        
        <!-- Floating Particles -->
        <div class="particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>
        
        <!-- Glowing Rings -->
        <div class="glow-ring ring-1"></div>
        <div class="glow-ring ring-2"></div>
        <div class="glow-ring ring-3"></div>
        
        <!-- Logo Container with Holographic Effect -->
        <div class="logo-container">
          <div class="logo-glow"></div>
          <div class="logo-border"></div>
          <img src="/pwa-192.png" alt="MHT Logo" class="logo-image" />
          <div class="scan-line"></div>
        </div>
        
        <!-- Futuristic Text -->
        <div class="loader-title">
          <span class="title-letter" style="animation-delay: 0.1s">M</span>
          <span class="title-letter" style="animation-delay: 0.15s">o</span>
          <span class="title-letter" style="animation-delay: 0.2s">n</span>
          <span class="title-letter" style="animation-delay: 0.25s">i</span>
          <span class="title-letter" style="animation-delay: 0.3s">r</span>
          <span class="title-letter" style="animation-delay: 0.35s">u</span>
          <span class="title-letter" style="animation-delay: 0.4s">l</span>
          <span class="title-letter" style="animation-delay: 0.45s">&nbsp;</span>
          <span class="title-letter" style="animation-delay: 0.5s">H</span>
          <span class="title-letter" style="animation-delay: 0.55s">a</span>
          <span class="title-letter" style="animation-delay: 0.6s">s</span>
          <span class="title-letter" style="animation-delay: 0.65s">a</span>
          <span class="title-letter" style="animation-delay: 0.7s">n</span>
          <span class="title-letter" style="animation-delay: 0.75s">&nbsp;</span>
          <span class="title-letter" style="animation-delay: 0.8s">T</span>
          <span class="title-letter" style="animation-delay: 0.85s">a</span>
          <span class="title-letter" style="animation-delay: 0.9s">l</span>
          <span class="title-letter" style="animation-delay: 0.95s">h</span>
          <span class="title-letter" style="animation-delay: 1s">a</span>
        </div>
        
        <!-- Subtitle with typing effect -->
        <div class="loader-subtitle">
          <span class="typing-text">Initializing Portfolio...</span>
          <span class="cursor">|</span>
        </div>
        
        <!-- Futuristic Progress Bar -->
        <div class="progress-container">
          <div class="progress-track">
            <div class="progress-fill"></div>
            <div class="progress-glow"></div>
          </div>
          <div class="progress-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
        
        <style>
          /* Cyber Grid Background */
          .cyber-grid {
            position: absolute;
            inset: 0;
            background-image: 
              linear-gradient(rgba(29, 185, 84, 0.03) 1px, transparent 1px),
              linear-gradient(90deg, rgba(29, 185, 84, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
          }
          @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
          }
          
          /* Floating Particles */
          .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }
          .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #1db954;
            border-radius: 50%;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
            box-shadow: 0 0 10px #1db954, 0 0 20px #1db954;
          }
          .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
          .particle:nth-child(2) { left: 20%; top: 80%; animation-delay: 1s; }
          .particle:nth-child(3) { left: 60%; top: 30%; animation-delay: 2s; }
          .particle:nth-child(4) { left: 80%; top: 70%; animation-delay: 3s; }
          .particle:nth-child(5) { left: 40%; top: 10%; animation-delay: 4s; }
          .particle:nth-child(6) { left: 90%; top: 50%; animation-delay: 5s; }
          @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-30px) scale(1.5); opacity: 1; }
          }
          
          /* Glowing Rings */
          .glow-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(29, 185, 84, 0.3);
            animation: ringPulse 3s ease-in-out infinite;
          }
          .ring-1 { width: 200px; height: 200px; animation-delay: 0s; }
          .ring-2 { width: 280px; height: 280px; animation-delay: 0.5s; }
          .ring-3 { width: 360px; height: 360px; animation-delay: 1s; }
          @keyframes ringPulse {
            0%, 100% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); opacity: 0.5; }
          }
          
          /* Logo Container */
          .logo-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 40px;
            z-index: 10;
          }
          .logo-glow {
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(29, 185, 84, 0.4) 0%, transparent 70%);
            animation: glowPulse 2s ease-in-out infinite;
          }
          @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
          }
          .logo-border {
            position: absolute;
            inset: 0;
            border-radius: 28px;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1db954, #0a5c2a, #1db954) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderRotate 3s linear infinite;
          }
          @keyframes borderRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
          }
          .logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
            animation: logoFloat 3s ease-in-out infinite;
          }
          @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
          }
          .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #1db954, transparent);
            animation: scan 2s linear infinite;
            opacity: 0.7;
          }
          @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
          }
          
          /* Title Animation */
          .loader-title {
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: 2px;
            z-index: 10;
            text-shadow: 0 0 20px rgba(29, 185, 84, 0.5);
          }
          .title-letter {
            display: inline-block;
            animation: letterReveal 0.5s ease forwards;
            opacity: 0;
            transform: translateY(20px);
          }
          @keyframes letterReveal {
            to { opacity: 1; transform: translateY(0); }
          }
          
          /* Subtitle with typing effect */
          .loader-subtitle {
            font-family: 'Inter', monospace;
            font-size: 14px;
            color: rgba(29, 185, 84, 0.8);
            margin-bottom: 32px;
            z-index: 10;
          }
          .typing-text {
            display: inline;
          }
          .cursor {
            animation: blink 0.8s infinite;
            color: #1db954;
          }
          @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
          }
          
          /* Progress Bar */
          .progress-container {
            width: 240px;
            z-index: 10;
          }
          .progress-track {
            position: relative;
            height: 6px;
            background: rgba(29, 185, 84, 0.1);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(29, 185, 84, 0.2);
          }
          .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0a5c2a, #1db954, #0a5c2a);
            background-size: 200% 100%;
            animation: progressFill 2.5s ease-in-out forwards, progressShine 1s linear infinite;
            width: 0%;
          }
          @keyframes progressFill {
            0% { width: 0%; }
            100% { width: 100%; }
          }
          @keyframes progressShine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
          }
          .progress-glow {
            position: absolute;
            top: -2px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, transparent, rgba(29, 185, 84, 0.5), transparent);
            animation: glowMove 2s linear infinite;
          }
          @keyframes glowMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
          }
          .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
          }
          .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(29, 185, 84, 0.3);
            animation: dotPulse 1.5s ease-in-out infinite;
          }
          .dot:nth-child(2) { animation-delay: 0.3s; }
          .dot:nth-child(3) { animation-delay: 0.6s; }
          .dot.active {
            background: #1db954;
            box-shadow: 0 0 10px #1db954;
          }
          @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide loader with 2.5 second delay for full animation experience
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
            loader.style.opacity = '0';
            loader.style.transform = 'scale(1.05)';
            setTimeout(() => loader.remove(), 800);
          }
        }, 2500);
      });
    </script>
  </body>
</html>
