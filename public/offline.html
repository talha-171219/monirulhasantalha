<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Offline - Talha Portfolio</title>
    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: linear-gradient(180deg, #08131a, #0f2a2b);
        color: #e9f1f0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .card {
        max-width: 400px;
        padding: 32px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
      }
      h1 {
        color: #1db954;
        margin-bottom: 16px;
      }
      a {
        color: #1db954;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      .icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>You're Offline</h1>
      <p>It looks like you're not connected to the internet. Some features may be unavailable.</p>
      <p style="margin-top: 24px;"><a href="/">Go back to the app</a></p>
    </div>
  </body>
</html>
